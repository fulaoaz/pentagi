name: Sync upstream into zh-CN

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: "要同步的上游分支"
        required: true
        default: main
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.repository == 'fulaoaz/pentagi'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout zh-CN
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: zh-CN

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 23
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Merge upstream main for review
        id: merge
        env:
          UPSTREAM_BRANCH: ${{ inputs.upstream_branch || 'main' }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add upstream https://github.com/vxcontrol/pentagi.git
          git fetch upstream "$UPSTREAM_BRANCH" --prune

          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "updates=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git merge --no-ff --no-commit "upstream/$UPSTREAM_BRANCH"; then
            git merge --abort || true
            echo "上游合并存在冲突；请在本地 zh-CN 分支解决后再运行同步。" >&2
            exit 1
          fi
          echo "updates=true" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        if: steps.merge.outputs.updates == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend localization gates
        if: steps.merge.outputs.updates == 'true'
        working-directory: frontend
        run: |
          pnpm run i18n:check
          pnpm exec vitest run src/pages/settings/provider-test-labels.test.ts
          pnpm run prettier

      - name: Run backend localization and regression gates
        if: steps.merge.outputs.updates == 'true'
        working-directory: backend
        env:
          GOSUMDB: "sum.golang.org"
        run: |
          go test ./cmd/installer/wizard/locale
          go test ./pkg/server/response
          go test ./pkg/server/services -run '^TestLocalizedGraphQLErrorPresenter$'
          go test ./pkg/config ./pkg/tools ./pkg/providers/embeddings

      - name: Check merged diff
        if: steps.merge.outputs.updates == 'true'
        run: |
          git diff --check

      - name: Create or update synchronization PR
        if: steps.merge.outputs.updates == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          base: zh-CN
          branch: sync/upstream-main
          delete-branch: true
          commit-message: |
            chore(upstream): merge upstream main

            Constraint: Preserve zh-CN localization while importing upstream changes
            Confidence: high
            Scope-risk: broad
          title: "chore(upstream): sync latest upstream main"
          body: |
            自动合并 `vxcontrol/pentagi:main` 的最新改动。

            本工作流已在合并前运行：

            - 前端英文基线与提供商测试标签门禁
            - 前端 Prettier 格式检查
            - 安装器、REST/GraphQL 错误响应本地化测试
            - 配置、搜索工具、嵌入模型回归测试
            - `git diff --check`

            如果门禁发现新增英文，请先区分技术标识和用户文案，再补充中文词典并合并此 PR。
