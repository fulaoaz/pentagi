name: Build and publish zh-CN image

on:
  push:
    branches:
      - zh-CN
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: zh-cn-image
  cancel-in-progress: true

jobs:
  build-and-push:
    if: github.repository == 'fulaoaz/pentagi'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pentagi
          tags: |
            type=raw,value=zh-cn
            type=sha,prefix=zh-cn-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PACKAGE_VER=zh-CN
            PACKAGE_REV=${{ github.sha }}
          cache-from: type=gha,scope=zh-cn-image
          cache-to: type=gha,mode=max,scope=zh-cn-image
          provenance: true
          sbom: true
